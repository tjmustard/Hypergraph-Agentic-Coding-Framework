# Dated USD rates for dev/telemetry/collect_metrics.py --prices (H5 instrument, v0.6.6).
# Every rate below is stated on the source page. A rate the page does not state is written
# as {usd: <n>, derived: "<rule>"}; never an invented number.
schema: hacf.prices/v1
currency: USD
unit: per_million_tokens
source: https://platform.claude.com/docs/en/about-claude/pricing
retrieved: "2026-11-25"
note: >-
  cache_write is the 5-minute cache write rate (the transcripts do not say which TTL a write used).
  Haiku 5.5 long_prompt rates apply per request when the prompt (fresh input + cache read +
  cache write) is above threshold_tokens.
models:
  claude-opus-5-5:
    fresh_in: 4.0
    cache_write: 5.0
    cache_read: 0.20
    output: 20.0
  claude-sonnet-5-5:
    fresh_in: 2.0
    cache_write: 2.50
    cache_read: 0.10
    output: 10.0
  claude-haiku-5-5:
    fresh_in: 0.10
    cache_write: 0.125
    cache_read: 0.01
    output: 0.50
    long_prompt:
      threshold_tokens: 100000
      fresh_in: 0.50
      cache_write: 0.625
      cache_read: 0.05
      output: 2.50

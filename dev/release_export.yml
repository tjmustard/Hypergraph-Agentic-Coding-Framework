# The release-export profile: what `dev/release_export.py` builds for each public release.
# Schema hacf.release-export/v2; validate with `python3 dev/release_export.py profile check`.
# v2 names no private value and no digest of one (lead P14 F1): private literals live only in the
# untracked digest file (--digests / HACF_EXPORT_DIGESTS), which must hold every label of
# required_digest_labels (`release_export.py digest-line` prints a line for it). scan.strict holds
# only the tool's generic home roots, written with the first / escaped so these bytes hold neither.
# Each exclude row is {path, reason, versions}; a trailing / means a directory. A `versions` value is
# all, <v>, <=<v> or >=<v>. Removing a row is a later release's deliberate act, never a gate fix.
schema: hacf.release-export/v2
base: 984ca46f3f87b95856b402f595d10017e05497a5
required_digest_labels:
  - private-project
  - projects-dir
  - host-name
  - account-address
  - account-regex
  - evidence-root
  - private-address
  - notifier
identity:
  name: "Thomas J. L. Mustard Ph.D."
  email_from: base

# The scan (mission R9). Strict literals are stored as sha256 + length, so no tracked file names
# them; the tool hashes every window of that length. The private address is matched only by the
# digest file named by --digests or HACF_EXPORT_DIGESTS (never tracked).
scan:
  strict:
    - label: home-dir # the Linux home root
      literal: "\x2Fhome/"
    - label: users-dir # the macOS home root
      literal: "\x2FUsers/"
  # Raw-only keys of the recorded live captures (F7): a JSON key of these names fails anywhere.
  strict_keys:
    - apiKeySource
    - credential_expires_at
    - five_hour
    - isUsingOverage
    - messaging_socket_path
    - overageDisabledReason
    - overageStatus
    - rate_limit_event
    - rate_limit_info
    - request_id
    - seven_day
    - unifiedWindows
  email_allowlist:
    - example.com
    - example.org
    - example.net
    - "*.invalid"
    - "*.test"
    - localhost
    - users.noreply.github.com
    - noreply@anthropic.com
    - tjmustard@mustardfamily.com # the contact address of CODE_OF_CONDUCT.md and SECURITY.md, public on the base
  advisory:
    - label: kernel-seat
      regex: "@kernel"
    - label: hacf-home
      regex: "~/\\.hacf"
    - label: hacf-state
      regex: "\\.hacf/hacf"
    - label: pytest-temp
      regex: "pytest-of-"
    - label: initials
      regex: "\\bTJ\\b"
    - label: advisor-seat
      regex: "advisor-lead"
# Allowlist rows (mission R9, R19): {path, pattern, count, reason, versions} with an exact count,
# or {path, blob_sha256, reason, versions} for a binary blob. Never for a digest-file label or
# a digest hit; raw-key only for this file's own path. Measured by `scan` at 0.6.0, 0.6.1 and 0.6.2 (overlay HEAD); a
# row whose file is absent at a version reports n/a there. The contact address needs no row: it is
# on scan.email_allowlist.
allowlist:
  - path: dev/tests/engine/test_engine_integration.py
    pattern: home-dir
    count: 3
    reason: "synthetic: a fake $HOME under the home root in the sandbox argv and oracle env tests"
    versions: all
  - path: dev/tests/compat/test_openrig_compat.py
    pattern: home-dir
    count: 1
    reason: "synthetic: a fake temp path under the home root in the capture helper"
    versions: all
  - path: dev/tests/compat/test_openrig_watch_install.py
    pattern: home-dir
    count: 2
    reason: "negative assertion: the templates, installer and watcher hold no home path"
    versions: all

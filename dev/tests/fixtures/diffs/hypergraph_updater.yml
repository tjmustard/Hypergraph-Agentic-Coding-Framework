# dev/tests/ledger/test_updater_compat.py: one commit writes each `changes` path with its
# placeholder content on top of the real ledger fixture migrated to v2, then
# `hypergraph_updater.py --from-diff HEAD^..HEAD --json` must print `expected`.
description: >-
  The updater's own file maps to hypergraph_updater; semantic_graph_merger and
  hyper_orchestrator depend on it, and member_of orchestration_layer is not traversed.

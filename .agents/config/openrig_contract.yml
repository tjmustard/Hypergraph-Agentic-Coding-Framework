# .agents/config/openrig_contract.yml: the OpenRig versions HACF delegates to.
#
# hyper_openrig.py reads this file (load_contract). Any doubt about it (missing, unreadable, too
# large, malformed, an unknown key) drops the whole file and narrows to the compiled-in
# FALLBACK_RIG_VERSIONS; it never widens. Versions are quoted strings.
#
# It changes only through a HACF release or a person's own commit (or the watcher's local commit on
# its own branch, accepted_by: watcher). An installed project never changes it silently.
#
# integrity: `npm view @openrig/cli@<version> dist.integrity`. verdict: the evidence the entry was
# accepted on. range: an unlisted patch at or above min_patch in that major.minor is probed.

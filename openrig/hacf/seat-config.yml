# The hacf team's per-seat configuration: HACF's DEFAULTS, one entry per role of roles.yml.
#
# This file is HACF's: an upgrade replaces it. A change of your own goes in overrides.yml beside
# it, which no HACF tool ever writes, creates, edits or deletes, and which an upgrade never
# touches. Precedence, per role and per key: this file's default < the named preset < overrides.yml.
# bin/seat-config.py validate checks all of it; bin/seat-config.py resolve prints the result with
# the source of each value (default, preset:<name> or override).
#
# sections: the files this config reads for the keys it does not hold itself.
#   context  caps.yml  : cap_tokens, behaviour and reset_scope per role (the context guard reads
#                        them through bin/seat-config.py; caps.yml stays the tripwire's source)
#   tools    roles.yml : tools allow/deny per role. It is resolved from roles.yml only from the
#                        version after v0.6.6; v0.6.6 reads no tool key from here.
# keys of a seat entry in this file: model, effort (low|medium|high|xhigh|max). overrides.yml and
#   presets may also set the context keys cap_tokens, behaviour and reset_scope.
# preset: the name of presets/<name>.yml to apply between these defaults and overrides.yml, or
#   null. v0.6.6 ships no preset. presets/ is HACF's: a later plan adds and replaces shipped
#   presets, and removes a live preset HACF no longer ships only when its blob is HACF's own text
#   (otherwise it is kept and reported). An override naming a missing preset is refused.
# reserved: keys later versions will fill (harness, instructions, skills, tools, mcp). They are
#   refused anywhere today, so a typo cannot pass for a setting.
#
# Models reach a running seat only through the commands that bin/seat-config-upgrade.py prints
# (rig seat set-model / set-effort, then a fresh launch). Nothing here changes a live seat.
# The tiered models below are the seats that held in the v0.6.6 H5 experiment; the others stay on
# Opus. The verdict and its numbers: dev/telemetry/h5-v066.md.
schema: hacf.seat-config/v1
sections:
  context: caps.yml
  tools: roles.yml
preset: null
reserved: [harness, instructions, skills, tools, mcp]
seats:
  lead:      {model: claude-opus-5-5}
  architect: {model: claude-opus-5-5}
  red-team:  {model: claude-opus-5-5}
  resolve:   {model: claude-opus-5-5}
  execute:   {model: claude-sonnet-5-5, effort: medium}
  audit:     {model: claude-opus-5-5}
  scribe:    {model: claude-haiku-5-5}

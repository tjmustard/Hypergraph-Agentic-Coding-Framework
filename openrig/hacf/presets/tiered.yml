# The shipped tiered defaults: the same model and effort per seat as seat-config.yml.
# Select it with `preset: tiered` in seat-config.yml; none is selected by default. Your
# overrides.yml still wins over every value here. This file is HACF's: an upgrade replaces it.
schema: hacf.seat-preset/v2
tested: "H5 v0.6.6 (dev/telemetry/h5-v066.md)"
seats:
  lead:      {model: claude-opus-5-5}
  architect: {model: claude-opus-5-5}
  red-team:  {model: claude-opus-5-5}
  resolve:   {model: claude-opus-5-5}
  execute:   {model: claude-sonnet-5-5, effort: medium}
  audit:     {model: claude-opus-5-5}
  scribe:    {model: claude-haiku-5-5}

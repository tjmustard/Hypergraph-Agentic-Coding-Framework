# The hacf team's role table, roles v2 (v0.6.4): which native Claude Code tools each seat's role
# uses, which it denies, whether it needs MCP servers, and its skills. One entry per profile of
# agents/hacf/agent.yaml.
#
# rig.yaml carries one rig-level `env:` key (v0.6.4); per-seat tool rules are still applied per
# seat, so it keeps launching on every OpenRig this rig is tested against. This table is applied
# per seat: bin/seat-rules.py turns one role
# into the JSON that `rig seat set-permissions <seat> --rules <file>` takes, and OPS.md is the
# operator's apply, probe and rollback recipe. Nothing applies it on its own.
#
# tools_allow is for review only: seat-rules.py never emits an allow rule. Under the shipped
#   `builtin:yolo` an allow constrains nothing, and under a prompting mode a bare allow such as
#   `Bash` would pre-approve that tool and widen the seat.
# tools_deny is the rule set seat-rules.py emits. Deny only what a role clearly never needs:
#   AskUserQuestion  every seat runs unattended; startup/protocol.md:106-111 forbids it and says
#                    the rule overrides any skill that instructs it.
#   NotebookEdit     the repository has no notebook and no guidance file names one.
#   EnterPlanMode,   the seats run unattended; nobody approves a plan.
#   ExitPlanMode
#   EnterWorktree,   the seats never create worktrees; the pipeline notes forbid
#   ExitWorktree     `git worktree add`.
# roles v2 (v0.6.4) adds, per role, from the start-up probe's init inventory
# (dev/telemetry/startup-baseline-v064.md):
#   - every built-in tool in neither the role's tools_allow nor its role file or stage skill(s):
#     CronCreate, CronDelete, CronList, DesignSync, ListAgents, ListMcpResourcesTool, Monitor,
#     PushNotification, ReadMcpResourceDirTool, ReadMcpResourceTool, RemoteTrigger,
#     ReportFindings, ScheduleWakeup, SendMessage, TaskStop, Workflow. Task stays (it may be the
#     init name of the Agent tool), and ToolSearch stays (deferred tools such as WebSearch need it);
#   - a bare `mcp__<server>` deny for each MCP server the inventory listed. codebase-memory-mcp is
#     never denied (TJ: keep it where MCP is on), and seat-rules.py --check refuses a deny of it.
#     A server on another host that is not in this list is not denied.
# mcp: off is recorded intent. No guidance file or HACF skill calls an MCP tool (the code graph is
#   the hyper_codegraph.py CLI). No `rig seat` verb sets MCP loading on an existing seat
#   (OpenRig 0.7.21), so OPS.md does not change it and the saving is reported unknown.
# skills: the skill ids agent.yaml may grant that role.
schema: hacf.roles/v1

roles:
  # guidance/lead.md dispatches by queue row and asks the person through a durable row
  # (startup/protocol.md:106-111: never AskUserQuestion). Agent stays: the lead may fan out reads.
  # v2 denies: the built-ins guidance/lead.md and hyper-sop never name, and the 23
  # listed MCP servers.
  lead:
    tools_allow: [Read, Grep, Glob, Bash, Edit, Write, Skill, Agent, WebFetch, WebSearch, TodoWrite]
    tools_deny:
      [AskUserQuestion, NotebookEdit, EnterPlanMode, ExitPlanMode, EnterWorktree, ExitWorktree,
       CronCreate, CronDelete, CronList, DesignSync, ListAgents, ListMcpResourcesTool, Monitor,
       PushNotification, ReadMcpResourceDirTool, ReadMcpResourceTool, RemoteTrigger, ReportFindings,
       ScheduleWakeup, SendMessage, TaskStop, Workflow, mcp__plugin_productivity_slack,
       mcp__plugin_productivity_notion, mcp__plugin_productivity_linear,
       mcp__plugin_productivity_atlassian, mcp__plugin_productivity_monday,
       mcp__plugin_productivity_clickup, mcp__plugin_productivity_google_calendar,
       mcp__plugin_productivity_gmail, mcp__plugin_product-management_figma,
       mcp__plugin_product-management_amplitude, mcp__plugin_product-management_amplitude-eu,
       mcp__plugin_product-management_pendo, mcp__plugin_product-management_intercom,
       mcp__plugin_product-management_fireflies, mcp__plugin_product-management_google_calendar,
       mcp__plugin_product-management_gmail, mcp__plugin_product-management_similarweb,
       mcp__plugin_human-resources_google_calendar, mcp__plugin_human-resources_gmail,
       mcp__claude_ai_Claude_Docs, mcp__claude_ai_Google_Drive, mcp__claude_ai_Gmail,
       mcp__claude_ai_Google_Calendar]
    mcp: off
    skills: [adversarial-agent-hardening]

